name: Fabriquer l'APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Fabriquer l'APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ScanCourses.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ScanCourses-apk
          path: ScanCourses.apk

      - name: Publier dans les Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Scan Courses 1.0.${{ github.run_number }}
          body: |
            Télécharge **ScanCourses.apk** sur ton téléphone Android et ouvre-le pour l'installer.
            Lien direct, toujours vers la dernière version :
            https://github.com/${{ github.repository }}/releases/latest/download/ScanCourses.apk
          files: ScanCourses.apk
          make_latest: true
