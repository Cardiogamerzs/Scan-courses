name: Fabriquer l'APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # La base produits est téléchargée une fois par semaine puis gardée en cache
      - name: Semaine en cours
        id: week
        run: echo "w=$(date +%G-%V)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: offcache
        with:
          path: offdata
          key: offdata-v6-${{ steps.week.outputs.w }}

      - name: Télécharger la base Open Food Facts / Open Beauty Facts
        if: steps.offcache.outputs.cache-hit != 'true'
        run: python3 tools/fetch-off-csv.py offdata 50000 8000 15000

      - name: Construire la base hors ligne de l'appli
        run: node tools/build-db.mjs offdata/food.jsonl offdata/beauty.jsonl && node tools/diag-cosmetics.mjs && node tools/pack-db.mjs

      # Anglais sur tout le contenu : traduction automatique, gardée en cache (seuls les nouveaux textes sont traduits)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: |
            tools/tr-cache
            ~/.cache/huggingface
          key: tr-en-v2-${{ github.run_number }}
          restore-keys: |
            tr-en-v2-

      - name: Traduire le contenu en anglais
        run: |
          node tools/extract-strings.mjs > tr-strings.json
          N=$(python3 tools/translate.py tr-strings.json --count)
          echo "Textes à traduire : $N"
          if [ "$N" != "0" ]; then
            pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
            pip install --quiet "transformers<5" sentencepiece sacremoses
          fi
          python3 tools/translate.py tr-strings.json app/src/main/assets/data/tr-en.jgz

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Fabriquer l'APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Sovee.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Sovee-apk
          path: Sovee.apk

      - name: Publier dans les Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.7.${{ github.run_number }}
          name: Sovée 4.7.${{ github.run_number }}
          body: |
            Télécharge **Sovee.apk** sur ton téléphone Android et ouvre-le pour l'installer.
            Lien direct, toujours vers la dernière version :
            https://github.com/${{ github.repository }}/releases/latest/download/Sovee.apk
          files: |
            Sovee.apk
            tr-en-review.json
          make_latest: true

  # Vérification sur un vrai Android (émulateur) : installation, lancement, parcours de tous les écrans
  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: Sovee-apk

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Exemple de données RappelConso (vérification des champs)
        run: |
          curl -s "https://data.economie.gouv.fr/api/explore/v2.1/catalog/datasets/rappelconso-v2-gtin-trie/records?limit=2&order_by=date_publication%20desc&where=categorie_produit%3D%22alimentation%22" | head -c 4000 || true

      - name: Tester sur l'émulateur Android 14
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          ram-size: 4096M
          heap-size: 512M
          disk-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 4096
          script: bash tools/emulator-test.sh

      - name: Publier les résultats du test (captures, rapport)
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: emulator-${{ github.run_number }}
          name: Test émulateur ${{ github.run_number }}
          prerelease: true
          make_latest: false
          files: emulator-results.zip
