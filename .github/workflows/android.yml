name: Fabriquer l'APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # La base produits est téléchargée une fois par semaine puis gardée en cache
      - name: Semaine en cours
        id: week
        run: echo "w=$(date +%G-%V)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: offcache
        with:
          path: offdata
          key: offdata-v6-${{ steps.week.outputs.w }}

      - name: Télécharger la base Open Food Facts / Open Beauty Facts
        if: steps.offcache.outputs.cache-hit != 'true'
        run: python3 tools/fetch-off-csv.py offdata 50000 8000 15000

      # Compositions absentes de l'export CSV (remplies dans une autre langue) : complétées depuis la base complète
      - name: Compléter les listes d'ingrédients
        run: |
          python3 -m pip install --quiet --user --break-system-packages duckdb
          # Base complète (toutes langues) téléchargée d'un bloc : la lecture à distance est limitée (HTTP 429)
          curl -sSL --retry 5 --retry-delay 20 -o "$RUNNER_TEMP/food.parquet" \
            https://huggingface.co/datasets/openfoodfacts/product-database/resolve/main/food.parquet || true
          ls -l "$RUNNER_TEMP/food.parquet" || true
          if [ -s "$RUNNER_TEMP/food.parquet" ]; then export OFF_PARQUET="$RUNNER_TEMP/food.parquet"; fi
          python3 tools/fill-ingredients.py offdata/food.jsonl
          rm -f "$RUNNER_TEMP/food.parquet"

      - name: Construire la base hors ligne de l'appli
        run: node tools/build-db.mjs offdata/food.jsonl offdata/beauty.jsonl && node tools/diag-cosmetics.mjs && node tools/pack-db.mjs

      # Anglais sur tout le contenu : traduction automatique, gardée en cache (seuls les nouveaux textes sont traduits)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: |
            tools/tr-cache
            ~/.cache/huggingface
          key: tr-en-v2-${{ github.run_number }}
          restore-keys: |
            tr-en-v2-

      - name: Traduire le contenu en anglais
        run: |
          node tools/extract-strings.mjs > tr-strings.json
          N=$(python3 tools/translate.py tr-strings.json --count)
          echo "Textes à traduire : $N"
          if [ "$N" != "0" ]; then
            pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
            pip install --quiet "transformers<5" sentencepiece sacremoses
          fi
          python3 tools/translate.py tr-strings.json app/src/main/assets/data/tr-en.jgz

      # Les fichiers de l'appli (avec la base produits) servent aussi à la version iPhone
      - uses: actions/upload-artifact@v4
        with:
          name: Sovee-www
          path: app/src/main/assets
          retention-days: 3

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Fabriquer l'APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Sovee.apk

      # Version Play Store (AAB signé avec la clé d'upload), seulement si les 2 secrets SOVEE_KEYSTORE_BASE64 et SOVEE_KEYSTORE_PASSWORD existent
      - name: Fabriquer l'AAB pour le Play Store
        env:
          KS_B64: ${{ secrets.SOVEE_KEYSTORE_BASE64 }}
          SOVEE_KEYSTORE_PASSWORD: ${{ secrets.SOVEE_KEYSTORE_PASSWORD }}
          SOVEE_KEY_PASSWORD: ${{ secrets.SOVEE_KEYSTORE_PASSWORD }}
          SOVEE_KEY_ALIAS: sovee-upload
        run: |
          if [ -z "$KS_B64" ]; then echo "Pas de clé d'upload dans les secrets : AAB non fabriqué."; exit 0; fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          export SOVEE_KEYSTORE_FILE="$RUNNER_TEMP/upload.jks"
          ./gradlew bundleRelease --no-daemon
          cp app/build/outputs/bundle/release/app-release.aab Sovee-playstore.aab
          rm -f "$RUNNER_TEMP/upload.jks"
          ls -l Sovee-playstore.aab

      - uses: actions/upload-artifact@v4
        with:
          name: Sovee-apk
          path: Sovee.apk

      - name: Publier dans les Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.7.${{ github.run_number }}
          name: Sovée 4.7.${{ github.run_number }}
          body: |
            Télécharge **Sovee.apk** sur ton téléphone Android et ouvre-le pour l'installer.
            Lien direct, toujours vers la dernière version :
            https://github.com/${{ github.repository }}/releases/latest/download/Sovee.apk
          files: |
            Sovee.apk
            tr-en-review.json
            Sovee-playstore.aab
          make_latest: true

  # Vérification sur un vrai Android (émulateur) : installation, lancement, parcours de tous les écrans
  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: Sovee-apk

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Exemple de données RappelConso (vérification des champs)
        run: |
          curl -s "https://data.economie.gouv.fr/api/explore/v2.1/catalog/datasets/rappelconso-v2-gtin-trie/records?limit=2&order_by=date_publication%20desc&where=categorie_produit%3D%22alimentation%22" | head -c 4000 || true

      - name: Tester sur l'émulateur Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          ram-size: 4096M
          heap-size: 512M
          disk-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 4096
          script: bash tools/emulator-test.sh

      - name: Publier les résultats du test (captures, rapport)
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: emulator-${{ github.run_number }}
          name: Test émulateur ${{ github.run_number }}
          prerelease: true
          make_latest: false
          files: emulator-results.zip

  # Version iPhone : fabrication sur un Mac, lancement dans le simulateur, captures d'écran
  ios:
    needs: build
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: Sovee-www
          path: ios/www

      - name: Générer le projet Xcode
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Fabriquer l'appli pour le simulateur
        run: |
          cd ios
          xcodebuild -project Sovee.xcodeproj -scheme Sovee -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO build | tee xcodebuild.log | grep -E "error:|warning: .*Sovee/|BUILD" || true
          test -d build/Build/Products/Debug-iphonesimulator/Sovee.app

      - name: Tester dans le simulateur iPhone
        run: bash tools/ios-sim-test.sh ios/build/Build/Products/Debug-iphonesimulator/Sovee.app

      - name: Publier l'appli simulateur et les captures
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-${{ github.run_number }}
          name: iPhone (simulateur) ${{ github.run_number }}
          prerelease: true
          make_latest: false
          files: |
            ios-results.zip
            Sovee-ios-simulator.zip
            ios/xcodebuild.log
