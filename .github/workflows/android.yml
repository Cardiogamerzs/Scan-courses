name: Fabriquer l'APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # La base produits est téléchargée une fois par semaine puis gardée en cache
      - name: Semaine en cours
        id: week
        run: echo "w=$(date +%G-%V)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: offcache
        with:
          path: offdata
          key: offdata-v2-${{ steps.week.outputs.w }}

      - name: Télécharger la base Open Food Facts / Open Beauty Facts
        if: steps.offcache.outputs.cache-hit != 'true'
        run: python3 tools/fetch-off-csv.py offdata 50000 8000

      - name: Construire la base hors ligne de l'appli
        run: node tools/build-db.mjs offdata/food.jsonl offdata/beauty.jsonl

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Fabriquer l'APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ScanCourses.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ScanCourses-apk
          path: ScanCourses.apk

      - name: Publier dans les Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.1.${{ github.run_number }}
          name: Scan Courses 3.1.${{ github.run_number }}
          body: |
            Télécharge **ScanCourses.apk** sur ton téléphone Android et ouvre-le pour l'installer.
            Lien direct, toujours vers la dernière version :
            https://github.com/${{ github.repository }}/releases/latest/download/ScanCourses.apk
          files: ScanCourses.apk
          make_latest: true
