name: Garder le serveur de partage actif

# Un projet Supabase gratuit se met en pause après 7 jours sans aucune requête :
# une petite lecture deux fois par semaine le garde éveillé.
on:
  schedule:
    - cron: "17 6 * * 1,4"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Lecture d'une composition
        env:
          SB_URL: ${{ secrets.SOVEE_SUPABASE_URL }}
          SB_KEY: ${{ secrets.SOVEE_SUPABASE_KEY }}
        run: |
          if [ -z "$SB_URL" ]; then echo "Pas de serveur configuré."; exit 0; fi
          curl -sS --retry 3 -X POST "${SB_URL%/}/rest/v1/rpc/comm_get" \
            -H "apikey: $SB_KEY" -H "Content-Type: application/json" -d '{"p_code":"3017620422003"}'
