name: Garder le serveur de partage actif

# Un projet Supabase gratuit se met en pause après 7 jours sans aucune requête :
# une petite lecture deux fois par semaine le garde éveillé.
# Lancé à la main, il vérifie aussi que les comptes anonymes sont activés.
on:
  schedule:
    - cron: "17 6 * * 1,4"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lecture d'une composition
        run: |
          eval "$(node -e 'global.window={};require("./app/src/main/assets/community-config.js");const c=window.SOVEE_COMMUNITY||{};console.log("SB_URL="+(c.url||"")+"\nSB_KEY="+(c.key||""))')"
          if [ -z "$SB_URL" ]; then echo "Pas de serveur configuré."; exit 0; fi
          echo "comm_get :"
          curl -sS --retry 3 -X POST "${SB_URL%/}/rest/v1/rpc/comm_get" \
            -H "apikey: $SB_KEY" -H "Content-Type: application/json" -d '{"p_code":"3017620422003"}'
          echo
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Compte anonyme :"
            TOK=$(curl -sS -X POST "${SB_URL%/}/auth/v1/signup" -H "apikey: $SB_KEY" -H "Content-Type: application/json" -d '{"data":{}}' | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);console.error(j.user&&j.user.is_anonymous?"compte anonyme OK":"compte anonyme refusé : "+(j.msg||j.error_description||s.slice(0,200)));console.log(j.access_token||"")}catch(e){console.log("")}})')
            echo
            if [ -n "$TOK" ]; then
              echo "comm_submit (texte refusé exprès, rien n'est enregistré) :"
              curl -sS -X POST "${SB_URL%/}/rest/v1/rpc/comm_submit" -H "apikey: $SB_KEY" -H "Authorization: Bearer $TOK" \
                -H "Content-Type: application/json" -d '{"p_code":"0000000000000","p_text":"x"}'
              echo
            fi
          fi
